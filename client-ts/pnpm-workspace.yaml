# msgpackr-extract is msgpackr's OPTIONAL native accelerator, and msgpackr is a
# dependency of `effect`. This client never encodes msgpack, so building the
# accelerator would put a C++ toolchain in the install for nothing. pnpm refuses
# to guess: an install script it has no recorded decision for FAILS the install
# outright. This is that decision — and a NEW script-bearing dependency still
# fails loudly rather than inheriting this one's answer.
#
# It lives in `pnpm-workspace.yaml` because that is the only file pnpm 11 reads
# the setting from; the same key in `package.json` or `.npmrc` is ignored.
allowBuilds:
  msgpackr-extract: false
