# Three lanes, three questions — the split the README describes.
#
#   hermetic     did *we* break osfacts?   nix sandbox, self-referential fixtures
#   live-oracle  did the *OS* break it?    real noisy runner, diffed against ss/lsof
#   client-ts    did the reader drift?     tsc + vitest, no host, no binary
#
# The first two run on linux and darwin, because the whole point of the tool is
# that one binary answers the same questions where the two kernels draw
# different lines. They are separate jobs so branch protection can require the
# hermetic pair without requiring a lane whose input is a live host.
#
# client-ts runs on one platform only: it parses osfacts' output, it never asks
# the OS anything. Node and pnpm come from the same npins pin as the rest — this
# flake has zero inputs and keeps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: hermetic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#osfacts --no-link -L

  live-oracle:
    name: live-oracle (${{ matrix.os }})
    needs: hermetic
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # A red here is honest: the host's own tools disagree with osfacts. It is
      # a separate job from `hermetic` for exactly that reason — the sandbox
      # shuts the world out, and this lane IS the world.
      - run: bash scripts/live-oracle.sh

  client-ts:
    name: client-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Same npins pin as every other lane — no flake input, no setup-node.
      # `--impure` because the expr reads ./nix/nixpkgs.nix by relative path;
      # this is the idiom scripts/live-oracle.sh already uses.
      - name: typecheck + unit tests
        run: |
          nix shell --impure \
            --expr 'let pkgs = import ./nix/nixpkgs.nix {}; in [ pkgs.nodejs pkgs.pnpm ]' \
            -c bash -c 'cd client-ts && pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run test:unit'
