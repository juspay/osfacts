# Three lanes, three questions — the split the README describes.
#
#   hermetic     did *we* break osfacts?   nix sandbox, self-referential fixtures
#   live-oracle  did the *OS* break it?    real noisy runner, diffed against ss/lsof
#   client-ts    did the reader drift?     tsc + vitest, no host, no binary
#
# All three run on linux and darwin, because the whole point of the tool is that
# one binary answers the same questions where the two kernels draw different
# lines — and that holds for the reader too: the client spawns a child, so its
# tests write a real executable, chmod it, and assert on the errno the OS hands
# back. Those are the semantics that differ. A one-platform reader lane would
# be the only place in this repo that assumed the two kernels agree.
#
# They are separate jobs so branch protection can require the sandboxed lanes
# without requiring one whose input is a live host.
#
# Toolchains come from the same npins pin as the packages, via this flake's
# devShells — zero flake inputs, and pure (no `--impure`), because npins fetches
# by hash.
#
# Third-party actions are pinned to a commit, not a tag: a tag is mutable, and
# a mutable ref in a workflow with repository access is a supply-chain hole.
# The version comment is the human-readable half; the SHA is the contract.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No lane here writes to the repository, so nothing needs
# more; a job that ever does should raise its own permissions, not this.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: hermetic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
      - run: nix build .#osfacts --no-link -L

  live-oracle:
    name: live-oracle (${{ matrix.os }})
    needs: hermetic
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
      # A red here is honest: the host's own tools disagree with osfacts. It is
      # a separate job from `hermetic` for exactly that reason — the sandbox
      # shuts the world out, and this lane IS the world.
      - run: bash scripts/live-oracle.sh

  client-ts:
    name: client-ts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
      - name: typecheck + unit tests
        run: |
          nix develop .#client-ts -c bash -c '
            cd client-ts
            pnpm install --frozen-lockfile
            pnpm run typecheck
            pnpm run test:unit
          '
