# Two lanes, two questions — the split the README describes.
#
#   hermetic     did *we* break osfacts?   nix sandbox, self-referential fixtures
#   live-oracle  did the *OS* break it?    real noisy runner, diffed against ss/lsof
#
# Both run on linux and darwin, because the whole point of the tool is that one
# binary answers the same questions where the two kernels draw different lines.
# They are separate jobs so branch protection can require the hermetic pair
# without requiring a lane whose input is a live host.
#
# Still deferred: the TS client (client-ts/tsconfig.json extends the kolu
# monorepo's base config and has no lockfile of its own).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: hermetic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#osfacts --no-link -L

  live-oracle:
    name: live-oracle (${{ matrix.os }})
    needs: hermetic
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # A red here is honest: the host's own tools disagree with osfacts. It is
      # a separate job from `hermetic` for exactly that reason — the sandbox
      # shuts the world out, and this lane IS the world.
      - run: bash scripts/live-oracle.sh
